<div class="conntainer">
  <h1 class="text-center">Welcome to Ng Commerce Store </h1>

  <h3 #subheadinghome><strong #Categoriesheading></strong></h3>
  <div id="best_selling_products">
    @defer {
    <app-category-cards></app-category-cards>
    } @loading (minimum 10s) {
    <p>Please Waiting! Loading....</p>
    } @placeholder {
    <p>Placeholder content</p>
    }
    @error {
    <p>Failed to load large component.</p>
    }
  </div>
  <hr />
  <h3 #subheadinghome><strong #BestSellingHeading></strong></h3>
  <div id="best_selling_products">
    <app-best-seller type="BestSelling"></app-best-seller>
  </div>
  <hr />
  <h3 #subheadinghome><strong #OnsaleHeading></strong></h3>
  <div id="on_sale_products">
    <app-products-sale type="OnSale"></app-products-sale>
  </div>
  <hr />
  <h3 #subheadinghome><strong #FeaturedHeading></strong></h3>
  <div id="featured_products">
    <app-featured-products type="Featured"></app-featured-products>
  </div>

</div>
