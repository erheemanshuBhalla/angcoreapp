  <a class="navbar-brand text-white">JWT Auth System</a>
  <button class="btn btn-danger my-2 my-sm-0" (click)="onLogout()">Logout</button>

<div class="card m-5" style="width:18rem" *ngIf="userDetails">
  <ul class="list-group">
    <li class="list-group-item"><strong>Username : </strong>{{userDetails.username}}</li>
    <li class="list-group-item"><strong>Email Address : </strong>{{userDetails.emailAddress}}</li>
  </ul>
</div>


<div class="col-md-12">
  <div class="row">
    <div class="col-md-3">
      <label>Filters</label>
      <!-- Autocomplete of Products Here -->
      <form [formGroup]="productForm" (ngSubmit)="onSubmit()">
        <div class="ng-autocomplete">
          <label>Category</label>
          <ng-autocomplete formControlName="myAutocompleteControl" [data]="categories"
                           [searchKeyword]="keyword"
                           placeholder="Enter the Country Name"
                           (selected)='selectEvent($event)'
                           (inputChanged)='onChangeSearch($event)'
                           (inputFocused)='onFocused($event)'
                           historyIdentifier="categories"
                           [itemTemplate]="itemTemplate"
                           [notFoundTemplate]="notFoundTemplate">
          </ng-autocomplete>
          <!-- Display validation error message -->
          <div *ngIf="productForm.get('myAutocompleteControl')?.invalid &&  productForm.get('myAutocompleteControl')?.touched"
               class="error-message">
            This field is required.
          </div>
          <ng-template #itemTemplate let-item>
            <a [innerHTML]="item.name"></a>
          </ng-template>

          <ng-template #notFoundTemplate let-notFound>
            <div [innerHTML]="notFound"></div>
          </ng-template>
        </div>
        <br /><br />
        <div class="price_range">
          <label>Price Range:</label>
          <ngx-slider formControlName="price" [(value)]="minValue"
                      [(highValue)]="maxValue"
                      [options]="options"
                      (valueChange)="minValueChange($event)"
                      (highValueChange)="maxValueChange($event)"
                      (userChangeStart)="onUserChangeStart($event)"
                      (userChange)="onUserChange($event)"
                      (userChangeEnd)="onUserChangeEnd($event)"></ngx-slider>
        </div>
        <br /><br />
        <div formArrayName="size">
          <div *ngFor="let control of sizeArray.controls; let i = index">
            <input type="checkbox" [formControlName]="i" (change)="ChangeSize($event)">
            <label>{{ itemsSizes[i].name }}</label>
          </div>
        </div>

      </form>

    </div>
    <div class="col-md-9">
     
      <div class="row">
        @for (item of Products | async; track item.id; let i = $index) {
        <div class="col-md-4">
          <div class="card" style="width: 18rem;">
            <svg aria-label="Placeholder: Image cap" class="bd-placeholder-img card-img-top" height="180" preserveAspectRatio="xMidYMid slice" role="img" width="100%" xmlns="http://www.w3.org/2000/svg"><title>Placeholder</title><rect width="100%" height="100%" fill="#868e96"></rect><text x="50%" y="50%" fill="#dee2e6" dy=".3em">Image cap</text></svg>
